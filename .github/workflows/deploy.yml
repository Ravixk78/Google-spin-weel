name: Deploy to Hostinger VPS (spin.majlisaloud.cloud)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Live Domain VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting Deployment on Hostinger VPS (spin.majlisaloud.cloud)..."

            TARGET_DIR="/var/www/majlis-al-oud-spin"

            if [ ! -d "$TARGET_DIR" ]; then
              echo "📂 Cloning repository into $TARGET_DIR..."
              mkdir -p "$TARGET_DIR"
              git clone https://github.com/Ravixk78/Google-spin-weel.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"

            echo "📥 Pulling latest code from main branch..."
            git fetch origin main
            git reset --hard origin/main

            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            echo "📦 Installing root dependencies..."
            npm install --production=false

            echo "📦 Installing backend dependencies..."
            cd backend && npm install --production=false && cd ..

            echo "🏗️ Building Frontend Production Assets..."
            cd frontend && npm install --production=false && npm run build && cd ..

            echo "🌱 Initializing & Syncing SQLite Database Prizes..."
            node backend/src/db/seed.js || true

            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            echo "🔄 Restarting application with PM2..."
            pm2 reload ecosystem.config.js --update-env || pm2 restart majlis-spin-backend --update-env || pm2 start backend/src/server.js --name "majlis-spin-backend"
            pm2 save

            # Ensure Nginx symlink and reload
            rm -f /etc/nginx/sites-enabled/default 2>/dev/null || true
            ln -sf /etc/nginx/sites-available/majlis-spin /etc/nginx/sites-enabled/majlis-spin
            nginx -t && systemctl reload nginx

            echo "✅ Deployment completed successfully for spin.majlisaloud.cloud!"
